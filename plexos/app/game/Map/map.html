<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./css/map.css">
    <title>Mapa</title>
</head>
<body>

    <div class="map">
        <div class="map-frame">
            <div class="map-view">
                <img class="map-image legend" src="./img/legend.png" alt="Mapa: leyenda">
                <img class="map-image picture" src="./img/picture.png" alt="Mapa: foto">
            </div>
            <button type="button" class="map-switch"></button>
        </div>
    </div>

    <script type="module" src="./js/def.js"></script>
    <script type="module" src="./js/map.js"></script>
    <script type="module" src="./js/zoom.js"></script>
    <script type="module" src="./js/events.js"></script>
    <script type="module" src="./js/run.js"></script>

</body>
</html>

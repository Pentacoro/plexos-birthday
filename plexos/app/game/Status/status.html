<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./css/status.css">
    <title>Estado</title>
</head>
<body>

    <div class="status">
        <div class="player">
            <div class="player-card"></div>

                <p class="player-team"></p>
                <p class="player-code"><span class="label">Código de grupo</span><span class="code"></span></p>

            </div>
        </div>
        <div class="games"></div>
    </div>

    <script type="module" src="./js/def.js"></script>
    <script type="module" src="./js/progress.js"></script>
    <script type="module" src="./js/ui.js"></script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/plexos/app/game/Party/css/badge.css">
    <link rel="stylesheet" href="/plexos/app/game/Party/css/photos.css">
    <link rel="stylesheet" href="./css/webDetective.css">
    <title>Detective Web</title>
</head>
<body>

    <div class="puzzle">
        <div class="badge-row"></div>
        <div class="stage">
            <div class="env-back"></div>
            <div class="letter folded mode-text">
                <div class="letter-full">
                    <div class="letter-text"></div>
                    <div class="answer"><div class="answer-slots"></div></div>
                </div>
                <div class="half half-top"><div class="half-content"></div></div>
                <div class="half-fold">
                    <div class="half half-bottom"><div class="half-content"></div></div>
                    <div class="half half-back"></div>
                </div>
            </div>
            <div class="env-front"></div>
            <div class="env-flap"><span class="env-seal"></span></div>
            <button type="button" class="investigate">Responder</button>
            <div class="typebars"></div>
            <div class="machine">
                <div class="keys"></div>
                <button type="button" class="send">Enviar</button>
            </div>
            <p class="done-note"></p>
        </div>
    </div>

    <script type="module" src="./js/def.js"></script>
    <script type="module" src="./js/ui.js"></script>
    <script type="module" src="./js/paper.js"></script>
    <script type="module" src="./js/envelope.js"></script>
    <script type="module" src="./js/typewriter.js"></script>
    <script type="module" src="./js/webDetective.js"></script>
    <script type="module" src="./js/archive.js"></script>
    <script type="module" src="./js/tilt.js"></script>
    <script type="module" src="./js/events.js"></script>
    <script type="module" src="./js/run.js"></script>

</body>
</html>
